mcs.metadata:
  componentName: Available devices
kind: AdaptiveDialog
inputs:
  - kind: AutomaticTaskInput
    propertyName: VarDeviceType
    description: "List of possible values: Laptop, Desktop, Smartphone"
    entity: StringPrebuiltEntity
    shouldPromptUser: true

modelDescription: This topic helps users find devices that are available from our SharePoint Devices list. User can ask to see available devices and it will return a list of devices that are available which can include laptops, smartphones, accessories and more.
beginDialog:
  kind: OnRecognizedIntent
  id: main
  condition: =Topic.VarDeviceType = Blank()
  intent: {}
  actions:
    - kind: InvokeConnectorAction
      id: invokeConnectorAction_jP2YzH
      input:
        binding:
          $filter: =Concatenate("Status eq 'Available' and AssetType eq '", Topic.VarDeviceType, "'")
          dataset: https://<your-tenant>.sharepoint.com/sites/ContosoIT
          table: f1dbdfee-03a6-4ddf-93f9-917766cb4337
          view: 82603082-098f-43ea-9f10-6abe2ccd6701

      output:
        kind: SingleVariableOutputBinding
        variable: Global.VarDevices

      connectionReference: cts_itHelpDeskAssistant.shared_sharepointonline.7ea9d26a394f4d3b80e7e411ee71609d
      connectionProperties:
        usageDescription: Retrieves devices from SharePoint list
        mode: Invoker

      dynamicOutputSchema:
        kind: Record
        properties:
          value:
            description: List of Items
            order: 0
            type:
              kind: Table
              properties:
                "{ContentType}":
                  displayName: Content type
                  description: Name of the Content type of the item.
                  order: 31
                  type:
                    kind: Record
                    properties:
                      Id:
                        displayName: Id
                        order: 0
                        dynamicValuesConfig:
                          capability: List

                        type: String

                      Name:
                        displayName: Name
                        order: 1
                        type: String

                "{FilenameWithExtension}":
                  displayName: File name with extension
                  description: For libraries, returns file name including extension. For lists, returns the title property.
                  order: 26
                  type: String

                "{FullPath}":
                  displayName: Full Path
                  description: Full path of an item or a folder or a file
                  order: 28
                  type: String

                "{HasAttachments}":
                  displayName: Has attachments
                  description: Indicates the presence of attachments in the item.
                  order: 32
                  type: Boolean

                "{Identifier}":
                  displayName: Identifier
                  description: Value that can be used in file related actions for selecting a file.
                  order: 22
                  type: String

                "{IsFolder}":
                  displayName: Is folder
                  description: True when the item is a folder, false otherwise.
                  order: 23
                  type: Boolean

                "{Link}":
                  displayName: Link to item
                  description: Link that can be used to get to the file or list item. Only people with permissions to the item will be able to open the link.
                  order: 24
                  type: String

                "{ModerationComment}":
                  displayName: Comments associated with the content approval of this list item
                  description: The comments associated with moderation of the list item.
                  order: 30
                  type: String

                "{ModerationStatus}":
                  displayName: Content approval status
                  description: "The content approval status. It can be one of the following: Draft, Pending, Approved, or Rejected"
                  order: 29
                  type: String

                "{Name}":
                  displayName: Name
                  description: File name of the item in document libraries, display name of the item in lists.
                  order: 25
                  type: String

                "{Path}":
                  displayName: Folder path
                  description: Path to the folder the item is in, relative to the site address.
                  order: 27
                  type: String

                "{TriggerWindowEndToken}":
                  displayName: Trigger Window End Token
                  description: A token expressing the time of the current flow check. Use this if you want to check if one or more columns were modified since the last flow check.
                  order: 35
                  type: String

                "{TriggerWindowStartToken}":
                  displayName: Trigger Window Start Token
                  description: A token expressing the time of the last flow check. Use this if you want to check if one or more columns were modified since the last flow check.
                  order: 34
                  type: String

                "{VersionNumber}":
                  displayName: Version number
                  description: The version number of the file or the list item.
                  order: 33
                  type: String

                AssetType:
                  displayName: Asset type
                  description: "Specify the type of asset: laptop, smartphone, etc."
                  order: 5
                  type:
                    kind: Record
                    properties:
                      Value:
                        displayName: Value
                        order: 0
                        dynamicValuesConfig:
                          capability: List

                        type: String

                Author:
                  displayName: Created By
                  description: The user who created this item.
                  order: 20
                  type:
                    kind: Record
                    properties:
                      Claims:
                        displayName: Claims
                        description: Internal identifier for the user who created this item.
                        order: 0
                        dynamicValuesConfig:
                          capability: List

                        type: String

                      Department:
                        displayName: Department
                        description: Department name of the user who created this item.
                        order: 4
                        type: String

                      DisplayName:
                        displayName: DisplayName
                        description: The name of the user who created this item.
                        order: 1
                        type: String

                      Email:
                        displayName: Email
                        description: Email address of the user who created this item.
                        order: 2
                        type: String

                      JobTitle:
                        displayName: JobTitle
                        description: Job title of the user who created this item.
                        order: 5
                        type: String

                      Picture:
                        displayName: Picture
                        description: Link to a picture of the user who created this item.
                        order: 3
                        type: String

                Color:
                  displayName: Color
                  description: Color of the asset
                  order: 7
                  type:
                    kind: Record
                    properties:
                      Value:
                        displayName: Value
                        order: 0
                        dynamicValuesConfig:
                          capability: List

                        type: String

                ComplianceAssetId:
                  displayName: Compliance Asset Id
                  order: 17
                  type: String

                ConditionNotes:
                  displayName: Condition notes
                  description: Notes about the current condition of the asset
                  order: 15
                  type: String

                Created:
                  displayName: Created
                  description: When this item was created.
                  order: 19
                  type: DateTime

                CurrentOwner:
                  displayName: Current owner
                  description: Person currently using the asset
                  order: 12
                  type:
                    kind: Record
                    properties:
                      Claims:
                        displayName: Claims
                        order: 0
                        dynamicValuesConfig:
                          capability: List

                        type: String

                      Department:
                        displayName: Department
                        order: 4
                        type: String

                      DisplayName:
                        displayName: DisplayName
                        order: 1
                        type: String

                      Email:
                        displayName: Email
                        order: 2
                        type: String

                      JobTitle:
                        displayName: JobTitle
                        order: 5
                        type: String

                      Picture:
                        displayName: Picture
                        order: 3
                        type: String

                DueDate:
                  displayName: Due date
                  description: When the asset will be returned by the current owner
                  order: 14
                  type: Date

                Editor:
                  displayName: Modified By
                  description: The user who last changed this item.
                  order: 21
                  type:
                    kind: Record
                    properties:
                      Claims:
                        displayName: Claims
                        description: Internal identifier for the user who last changed this item.
                        order: 0
                        dynamicValuesConfig:
                          capability: List

                        type: String

                      Department:
                        displayName: Department
                        description: Department name of the user who last changed this item.
                        order: 4
                        type: String

                      DisplayName:
                        displayName: DisplayName
                        description: The name of the user who last changed this item.
                        order: 1
                        type: String

                      Email:
                        displayName: Email
                        description: Email address of the user who last changed this item.
                        order: 2
                        type: String

                      JobTitle:
                        displayName: JobTitle
                        description: Job title of the user who last changed this item.
                        order: 5
                        type: String

                      Picture:
                        displayName: Picture
                        description: Link to a picture of the user who last changed this item.
                        order: 3
                        type: String

                ID:
                  displayName: ID
                  description: List item id. Use this value for specifying the item to act on in other list related actions.
                  order: 0
                  type: Number

                Image:
                  displayName: Image
                  order: 6
                  type: String

                Manufacturer:
                  displayName: Manufacturer
                  description: Manufacturer of the asset
                  order: 3
                  type:
                    kind: Record
                    properties:
                      Value:
                        displayName: Value
                        order: 0
                        dynamicValuesConfig:
                          capability: List

                        type: String

                Model:
                  displayName: Model
                  description: "Model/make of the device (e.g: Surface Go, Surface Headphones etc)"
                  order: 4
                  type: String

                Modified:
                  displayName: Modified
                  description: When this item was last changed.
                  order: 18
                  type: DateTime

                OData__ColorTag:
                  displayName: Color Tag
                  order: 16
                  type: String

                OrderNumber:
                  displayName: "Order #"
                  description: Order or invoice number for the purchase
                  order: 11
                  type: String

                PreviousOwner:
                  displayName: Previous owner
                  description: Person who last used the asset
                  order: 13
                  type:
                    kind: Record
                    properties:
                      Claims:
                        displayName: Claims
                        order: 0
                        dynamicValuesConfig:
                          capability: List

                        type: String

                      Department:
                        displayName: Department
                        order: 4
                        type: String

                      DisplayName:
                        displayName: DisplayName
                        order: 1
                        type: String

                      Email:
                        displayName: Email
                        order: 2
                        type: String

                      JobTitle:
                        displayName: JobTitle
                        order: 5
                        type: String

                      Picture:
                        displayName: Picture
                        order: 3
                        type: String

                PurchaseDate:
                  displayName: Purchase date
                  description: When the asset was purchased
                  order: 9
                  type: Date

                PurchasePrice:
                  displayName: Purchase price
                  description: The purchase price of the asset
                  order: 10
                  type: Number

                SerialNumber:
                  displayName: Serial number
                  description: Serial number associated with the asset
                  order: 8
                  type: String

                Status:
                  displayName: Status
                  description: Checkout status of the asset
                  order: 2
                  type:
                    kind: Record
                    properties:
                      Value:
                        displayName: Value
                        order: 0
                        dynamicValuesConfig:
                          capability: List

                        type: String

                Title:
                  displayName: Title
                  order: 1
                  type: String

      operationId: GetItems

    - kind: SetVariable
      id: setVariable_QC5NpQ
      variable: Topic.VarAvailableDevices
      value: =Global.VarDevices.value

inputType:
  properties:
    VarDeviceType:
      displayName: VarDeviceType
      description: "List of possible values: Laptop, Desktop, Smartphone"
      type: String

outputType:
  properties:
    VarAvailableDevices:
      displayName: VarAvailableDevices
      description: List of available devices by device type
      type:
        kind: Table